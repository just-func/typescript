packages:
  - packages/*

# Native postinstall scripts pnpm blocks by default. They fail at build time rather
# than install time, so an unlisted one surfaces as a confusing build error.
onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild

# Supply-chain soak: no dependency may be installed until it has been on the registry
# for 24h. This is the control that stops a compromised release being pulled into a
# build within hours of publication.
#
# It must live here. In `.npmrc`, `minimumreleaseage` does not reach pnpm's typed
# config, so the soak is silently inert — which is how this repo was configured until
# now.
#
# `minimumReleaseAgeStrict` is required for it to mean anything. Without it pnpm runs
# LOOSE: a too-young package is not rejected, it is appended to
# `minimumReleaseAgeExclude` and installed anyway, so the soak excuses itself on every
# install and the waiver list grows on its own. That is exactly what happened here when
# type-plus 8.0.0-beta.11 was tried: pnpm wrote its own waiver rather than refusing.
minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeStrict: true

# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'

