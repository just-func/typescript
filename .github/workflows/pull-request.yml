name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  # The merge queue builds a temporary `gh-readonly-queue/**` branch that fires neither
  # `pull_request` nor `push`. Without this trigger the required `code / all-checks`
  # context never starts and the queue waits forever.
  merge_group:
  # The release job opens the Version Packages PR with the built-in GITHUB_TOKEN, whose
  # events start no workflows. It dispatches this workflow on the PR's branch instead,
  # so the required `code / all-checks` reports there.
  workflow_dispatch:

jobs:
  code:
    uses: just-func/.github/.github/workflows/pnpm-verify.yml@main
    with:
      os: '["ubuntu-latest"]'
